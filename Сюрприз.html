<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слайд-шоу Софе</title>
<style>
body {
  margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  background: #111; color: #fff;
  display: flex; justify-content: center; align-items: center;
  height: 100vh; overflow: hidden;
  flex-direction: column;
}
.slide {
  position: absolute;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  opacity: 0; transition: opacity 1s;
  width: 100%; height: 100%;
}
.slide.show { opacity: 1; }
.slide img { max-width: 80%; max-height: 70%; margin-top: 20px; }
.text { font-size: 2.5em; text-align: center; margin-bottom: 10px; }
#progressBar { width: 60%; height: 25px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 20px; }
#progress { height: 25px; width: 0; background: #4caf50; transition: width 0.3s; }
#flash { position: absolute; width: 100%; height: 100%; background: white; top:0; left:0; display:none; z-index:10; }
.typing { border-right: .1em solid #fff; white-space: pre-wrap; overflow: hidden; }
#countdownSlide .number { font-size:5em; margin-top:20px; }
</style>
</head>
<body>

<div id="flash"></div>

<!-- Слайды -->
<div id="loadingSlide" class="slide">
  <div class="text" id="loadingText">Загрузка... 0%</div>
  <div id="progressBar"><div id="progress"></div></div>
</div>

<div id="errorSlide" class="slide">
  <div class="text" style="font-size:4em;">Ошибка 404</div>
</div>

<div id="fixSlide" class="slide">
  <div class="text">Ща исправлю, всё норм</div>
</div>

<div id="countdownSlide" class="slide">
  <div class="text" style="font-size:3.5em;">Улыбнись😊, щас тебя сфоткаю📸</div>
  <div class="text number" id="timer"></div>
</div>

<div id="photo1Slide" class="slide">
  <div class="text">Что за красотка я в раю?</div>
  <img src="https://i.postimg.cc/mkvqMdTp/IMG-20260309-005232.jpg" alt="Фото 1">
</div>

<div id="photoVideoSlide" class="slide">
  <div class="text">Подожди, что это…</div>
  <img src="https://i.postimg.cc/KjdJKRmG/IMG-20260309-022120.jpg" alt="Фото вместо видео">
</div>

<div id="photo2Slide" class="slide">
  <div class="text">Твои глаза красивее и ярче чем звёзды на небе 🤩😍</div>
  <img src="https://i.postimg.cc/y6GzsjCS/IMG-20260309-004634.jpg" alt="Глаза">
</div>

<div id="photo3Slide" class="slide">
  <div class="text">Твоё каждое сообщение как глоток нон-стопа… заряжает настроение на весь день 😉</div>
  <img src="https://i.postimg.cc/Y9yT2rZp/IMG-20260309-005151.jpg" alt="Фото 3">
</div>

<div id="photo4Slide" class="slide">
  <div class="text typing" id="textTyping"></div>
  <img src="https://i.postimg.cc/05zyYb87/IMG-20260309-005257.jpg" alt="Фото 4">
</div>

<div id="photo5Slide" class="slide">
  <div class="text">Сделано Софе от Дани 💘😘</div>
  <img src="https://i.postimg.cc/NjnKqmf0/IMG-20260309-013240.jpg" alt="Фото 5">
</div>

<script>
function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }
async function showSlide(id){ document.getElementById(id).classList.add('show'); await sleep(10); }
async function hideSlide(id){ document.getElementById(id).classList.remove('show'); await sleep(10); }

async function runShow(){
  const loadingText = document.getElementById('loadingText');
  const progress = document.getElementById('progress');
  const timerEl = document.getElementById('timer');
  const flash = document.getElementById('flash');
  const textTyping = document.getElementById('textTyping');

  // Загрузка
  await showSlide('loadingSlide');
  for(let i=0;i<=100;i+=2){
    loadingText.innerText = `Загрузка... ${i}%`;
    progress.style.width = i + '%';
    await sleep(50);
  }
  await hideSlide('loadingSlide');

  // Ошибка
  await showSlide('errorSlide'); await sleep(2000); await hideSlide('errorSlide');

  // Починка
  await showSlide('fixSlide'); await sleep(2500); await hideSlide('fixSlide');

  // Отсчёт
  await showSlide('countdownSlide'); 
  await sleep(1500);
  document.querySelector("#countdownSlide .text").style.display='none'; // фраза исчезает

  for(let i=3;i>0;i--){
    timerEl.innerText = i;
    await sleep(1200);
    timerEl.innerText = '';
    await sleep(300);
  }
  await hideSlide('countdownSlide');

  // Вспышка
  flash.style.display='block'; await sleep(200); flash.style.display='none';

  // Фото 1
  await showSlide('photo1Slide'); await sleep(5000); await hideSlide('photo1Slide');

  // Фото вместо видео
  await showSlide('photoVideoSlide'); await sleep(5000); await hideSlide('photoVideoSlide');

  // Фото 2
  await showSlide('photo2Slide'); await sleep(5000); await hideSlide('photo2Slide');

  // Фото 3
  await showSlide('photo3Slide'); await sleep(5000); await hideSlide('photo3Slide');

  // Фото 4 с медленной печатью
  await showSlide('photo4Slide');
  let message = "Я тебя обожаю, ты самая лучшая подруга, улыбайся чаще :)";
  textTyping.innerText='';
  for(let i=0;i<message.length;i++){
    textTyping.innerText += message[i];
    await sleep(70);
  }
  await sleep(5000);
  await hideSlide('photo4Slide');

  // Фото 5 Финал
  await showSlide('photo5Slide');
}

runShow();
</script>

</body>
</html>
