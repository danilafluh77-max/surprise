<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Сюрприз!</title>

<style>
body {
    background:black;
    color:#00ff00;
    font-family:monospace;
    text-align:center;
    margin-top:20%;
    overflow:hidden;
}

#countdown {
    font-size:80px;
    font-weight:bold;
}

#final {
    display:none;
    font-size:30px;
    color:#ff2e63;
}

#cat {
    display:none;
    margin-top:20px;
    max-width:300px;
    border-radius:15px;
    box-shadow:0 0 25px white;
}

#flash {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:white;
    opacity:0;
    pointer-events:none;
}

@keyframes flashEffect {
    0% {opacity:0;}
    10% {opacity:1;}
    100% {opacity:0;}
}
</style>
</head>

<body>

<h2 id="loading">Улыбнись, сейчас тебя сфотографирую 📸</h2>
<div id="countdown"></div>

<div id="final">
<strong>Вот что получилось 😼</strong>
</div>

<img id="cat" src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=600" />

<div id="flash"></div>

<script>
let countdownNumbers = ["3", "2", "1"];
let countdownElem = document.getElementById("countdown");
let i = 0;

function showCountdown() {
    if (i < countdownNumbers.length) {
        countdownElem.innerText = countdownNumbers[i];
        i++;
        setTimeout(showCountdown, 1000);
    } else {
        countdownElem.innerText = "";
        // Вспышка и звук
        let flash = document.getElementById("flash");
        flash.style.animation = "flashEffect 0.6s ease-out";

        let audio = new Audio("https://www.soundjay.com/mechanical/camera-shutter-click-01.mp3");
        audio.play();

        // Показ фото кота
        setTimeout(() => {
            document.getElementById("final").style.display = "block";
            document.getElementById("cat").style.display = "block";
        }, 500);
    }
}

// Старт отсчета через 1 секунду после текста
setTimeout(showCountdown, 1000);
</script>

</body>
</html>
