<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loading...</title>

<style>
body {
    background:black;
    color:#00ff00;
    font-family:monospace;
    text-align:center;
    margin-top:20%;
    overflow:hidden;
}

#final {
    display:none;
    font-size:35px;
    color:#ff2e63;
}

#flash {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:white;
    opacity:0;
    pointer-events:none;
}

@keyframes flashEffect {
    0% {opacity:0;}
    10% {opacity:1;}
    100% {opacity:0;}
}
</style>
</head>

<body>

<h2 id="loading">Проверка пользователя...</h2>
<h3 id="percent">0%</h3>

<div id="final">
А ты знала что ты самая красивая? ☺️<br><br>
Улыбнись, сейчас тебя сфотографирую... 📸
</div>

<div id="flash"></div>

<script>
let p = 0;
let interval = setInterval(() => {
    p++;
    document.getElementById("percent").innerText = p + "%";

    if (p >= 100) {
        clearInterval(interval);
        document.getElementById("loading").style.display = "none";
        document.getElementById("percent").style.display = "none";
        document.getElementById("final").style.display = "block";

        // Спалах через 2 секунди
        setTimeout(() => {
            let flash = document.getElementById("flash");
            flash.style.animation = "flashEffect 0.6s ease-out";

            // Звук затвора (онлайн файл)
            let audio = new Audio("https://www.soundjay.com/mechanical/camera-shutter-click-01.mp3");
            audio.play();
        }, 2000);
    }
}, 40);
</script>

</body>
</html>
