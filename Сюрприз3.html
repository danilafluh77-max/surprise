<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слайд-шоу Софе</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    overflow: hidden;
    margin: 0;
    padding: 0;
    position: relative;
  }
  .hidden { display: none; }
  .photo {
    max-width: 80%;
    max-height: 80vh;
    margin: auto;
    display: block;
  }
  .text {
    font-size: 2.5em;
    margin: 20px 0;
    position: absolute;
    top: 20px;
    width: 100%;
  }
  .typing {
    border-right: .1em solid #fff;
    white-space: nowrap;
    overflow: hidden;
  }
  #flash {
    position: absolute;
    width: 100%;
    height: 100%;
    background: white;
    top:0; left:0;
    display: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="container">

  <!-- Вспышка -->
  <div id="flash"></div>

  <!-- Загрузка -->
  <div id="loading" class="text">Загрузка... 0%</div>

  <!-- Сбой -->
  <div id="error" class="text hidden">Ошибка 404</div>
  <div id="fixing" class="text hidden">Погоди, ща починю...</div>
  <div id="fixed" class="text hidden">Вроде всё 👍</div>

  <!-- Отсчёт -->
  <div id="countdown" class="text hidden"><span id="timer"></span></div>

  <!-- Фото и надписи -->
  <img id="photo1" class="photo hidden" src="https://i.postimg.cc/mkvqMdTp/IMG-20260309-005232.jpg" alt="Фото 1">
  <div id="text1" class="text hidden">Что за красотка я в раю?</div>

  <img id="photoVideo" class="photo hidden" src="https://i.postimg.cc/KjdJKRmG/IMG-20260309-022120.jpg" alt="Фото вместо видео">
  <div id="videoText" class="text hidden">Подожди, что это…</div>

  <img id="photo2" class="photo hidden" src="https://i.postimg.cc/y6GzsjCS/IMG-20260309-004634.jpg" alt="Глаза">
  <div id="text2" class="text hidden">Твои глаза красивее и ярче чем звёзды на небе 🤩😍</div>

  <img id="photo3" class="photo hidden" src="https://i.postimg.cc/Y9yT2rZp/IMG-20260309-005151.jpg" alt="Фото 3">
  <div id="text3" class="text hidden">Твоё каждое сообщение как глоток нон-стопа… заряжает настроение на весь день 💛</div>

  <img id="photo4" class="photo hidden" src="https://i.postimg.cc/05zyYb87/IMG-20260309-005257.jpg" alt="Фото 4">
  <div id="text4" class="text hidden typing"></div>

  <img id="photo5" class="photo hidden" src="https://i.postimg.cc/NjnKqmf0/IMG-20260309-013240.jpg" alt="Фото 5">
  <div id="final" class="text hidden">Сделано Софе от Дани 💘😘</div>

</div>

<script>
function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

async function runShow() {
  const loading = document.getElementById('loading');
  const error = document.getElementById('error');
  const fixing = document.getElementById('fixing');
  const fixed = document.getElementById('fixed');
  const countdown = document.getElementById('countdown');
  const timer = document.getElementById('timer');
  const flash = document.getElementById('flash');

  const photo1 = document.getElementById('photo1');
  const text1 = document.getElementById('text1');

  const photoVideo = document.getElementById('photoVideo');
  const videoText = document.getElementById('videoText');

  const photo2 = document.getElementById('photo2');
  const text2 = document.getElementById('text2');

  const photo3 = document.getElementById('photo3');
  const text3 = document.getElementById('text3');

  const photo4 = document.getElementById('photo4');
  const text4 = document.getElementById('text4');

  const photo5 = document.getElementById('photo5');
  const final = document.getElementById('final');

  // --- Загрузка ---
  for(let i=0;i<=100;i+=2){
    loading.innerText = `Загрузка... ${i}%`;
    await sleep(50);
  }
  loading.classList.add('hidden');

  // --- Сбой и починка ---
  error.classList.remove('hidden'); await sleep(2000); error.classList.add('hidden');
  fixing.classList.remove('hidden'); await sleep(2500); fixing.classList.add('hidden');
  fixed.classList.remove('hidden'); await sleep(2000); fixed.classList.add('hidden');

  // --- Отсчёт 3-2-1 с исчезновением ---
  countdown.classList.remove('hidden');
  for(let i=3;i>0;i--){
    timer.innerText = i;
    await sleep(1000);
    timer.innerText = '';
    await sleep(300);
  }
  countdown.classList.add('hidden');

  // --- Вспышка ---
  flash.style.display = 'block';
  await sleep(200);
  flash.style.display = 'none';

  // --- Фото 1 ---
  photo1.classList.remove('hidden');
  text1.classList.remove('hidden');
  await sleep(4000);
  photo1.classList.add('hidden');
  text1.classList.add('hidden');

  // --- Фото вместо видео ---
  photoVideo.classList.remove('hidden');
  videoText.classList.remove('hidden');
  await sleep(5000);
  photoVideo.classList.add('hidden');
  videoText.classList.add('hidden');

  // --- Фото 2 ---
  photo2.classList.remove('hidden');
  text2.classList.remove('hidden');
  await sleep(4000);
  photo2.classList.add('hidden');
  text2.classList.add('hidden');

  // --- Фото 3 ---
  photo3.classList.remove('hidden');
  text3.classList.remove('hidden');
  await sleep(4000);
  photo3.classList.add('hidden');
  text3.classList.add('hidden');

  // --- Фото 4 с медленной печатью ---
  photo4.classList.remove('hidden');
  text4.classList.remove('hidden');
  let message = "Я тя обожаю, самая лучшая подруга, спасибо что ты есть)";
  for(let i=0;i<message.length;i++){
    text4.innerText += message[i];
    await sleep(70);
  }
  await sleep(4000);
  photo4.classList.add('hidden');
  text4.classList.add('hidden');

  // --- Фото 5 Финал ---
  photo5.classList.remove('hidden');
  final.classList.remove('hidden');
}

runShow();
</script>
</body>
</html>
