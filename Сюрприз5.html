<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слайд-шоу Софе</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    margin: 0;
    padding: 0;
    overflow: hidden;
    position: relative;
  }
  .hidden { display: none; }
  .photo {
    max-width: 80%;
    max-height: 80vh;
    margin: auto;
    display: block;
    opacity: 0;
    transition: opacity 1s;
  }
  .photo.show { opacity: 1; }
  .text {
    font-size: 3em;
    position: absolute;
    top: 20px;
    width: 100%;
    transition: opacity 1s;
    opacity: 0;
  }
  .text.show { opacity: 1; }
  .typing {
    border-right: .1em solid #fff;
    white-space: nowrap;
    overflow: hidden;
  }
  #progressBar {
    width: 60%;
    background: #333;
    border-radius: 5px;
    overflow: hidden;
    margin: 20px auto;
    height: 25px;
  }
  #progress {
    height: 25px;
    width: 0;
    background: #4caf50;
    transition: width 0.3s;
  }
  #flash {
    position: absolute;
    width: 100%;
    height: 100%;
    background: white;
    top:0; left:0;
    display: none;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="flash"></div>

<!-- Загрузка -->
<div id="loading" class="text">Загрузка... 0%</div>
<div id="progressBar"><div id="progress"></div></div>

<!-- Сбой -->
<div id="error" class="text hidden">Ошибка 404</div>
<div id="fixing" class="text hidden">Погоди, ща починю...</div>
<div id="fixed" class="text hidden">Вроде всё 👍</div>

<!-- Отсчёт -->
<div id="countdown" class="text hidden"><span id="timer"></span></div>

<!-- Фото и надписи -->
<img id="photo1" class="photo" src="https://i.postimg.cc/mkvqMdTp/IMG-20260309-005232.jpg" alt="Фото 1">
<div id="text1" class="text">Что за красотка я в раю?</div>

<img id="photoVideo" class="photo" src="https://i.postimg.cc/KjdJKRmG/IMG-20260309-022120.jpg" alt="Фото вместо видео">
<div id="videoText" class="text">Подожди, что это…</div>

<img id="photo2" class="photo" src="https://i.postimg.cc/y6GzsjCS/IMG-20260309-004634.jpg" alt="Глаза">
<div id="text2" class="text">Твои глаза красивее и ярче чем звёзды на небе 🤩😍</div>

<img id="photo3" class="photo" src="https://i.postimg.cc/Y9yT2rZp/IMG-20260309-005151.jpg" alt="Фото 3">
<div id="text3" class="text">Твоё каждое сообщение как глоток нон-стопа… заряжает настроение на весь день 💛</div>

<img id="photo4" class="photo" src="https://i.postimg.cc/05zyYb87/IMG-20260309-005257.jpg" alt="Фото 4">
<div id="text4" class="text typing"></div>

<img id="photo5" class="photo" src="https://i.postimg.cc/NjnKqmf0/IMG-20260309-013240.jpg" alt="Фото 5">
<div id="final" class="text">Сделано Софе от Дани 💘😘</div>

<script>
function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

async function show(el){ el.classList.add('show'); await sleep(10); }
async function hide(el){ el.classList.remove('show'); await sleep(10); }

async function runShow() {
  const loading = document.getElementById('loading');
  const progress = document.getElementById('progress');
  const error = document.getElementById('error');
  const fixing = document.getElementById('fixing');
  const fixed = document.getElementById('fixed');
  const countdown = document.getElementById('countdown');
  const timer = document.getElementById('timer');
  const flash = document.getElementById('flash');

  const photo1 = document.getElementById('photo1');
  const text1 = document.getElementById('text1');

  const photoVideo = document.getElementById('photoVideo');
  const videoText = document.getElementById('videoText');

  const photo2 = document.getElementById('photo2');
  const text2 = document.getElementById('text2');

  const photo3 = document.getElementById('photo3');
  const text3 = document.getElementById('text3');

  const photo4 = document.getElementById('photo4');
  const text4 = document.getElementById('text4');

  const photo5 = document.getElementById('photo5');
  const final = document.getElementById('final');

  // --- Загрузка ---
  for(let i=0;i<=100;i+=2){
    loading.innerText = `Загрузка... ${i}%`;
    progress.style.width = i + '%';
    await sleep(50);
  }
  await hide(loading);
  document.getElementById('progressBar').style.display = 'none';

  // --- Сбой и починка ---
  await show(error); await sleep(2000); await hide(error);
  await show(fixing); await sleep(2500); await hide(fixing);
  await show(fixed); await sleep(2000); await hide(fixed);

  // --- Отсчёт 3-2-1 + вспышка ---
  countdown.classList.add('show');
  for(let i=3;i>0;i--){
    timer.innerText = i;
    await sleep(1000);
    timer.innerText = '';
    await sleep(300);
  }
  countdown.classList.remove('show');
  flash.style.display = 'block';
  await sleep(200);
  flash.style.display = 'none';

  // --- Фото 1 ---
  await show(photo1); await show(text1);
  await sleep(4000);
  await hide(photo1); await hide(text1);

  // --- Фото вместо видео ---
  await show(photoVideo); await show(videoText);
  await sleep(5000);
  await hide(photoVideo); await hide(videoText);

  // --- Фото 2 ---
  await show(photo2); await show(text2);
  await sleep(4000);
  await hide(photo2); await hide(text2);

  // --- Фото 3 ---
  await show(photo3); await show(text3);
  await sleep(4000);
  await hide(photo3); await hide(text3);

  // --- Фото 4 с медленной печатью ---
  await show(photo4); await show(text4);
  let message = "Я тя обожаю, самая лучшая подруга, спасибо что ты есть)";
  text4.innerText = '';
  for(let i=0;i<message.length;i++){
    text4.innerText += message[i];
    await sleep(70);
  }
  await sleep(4000);
  await hide(photo4); await hide(text4);

  // --- Фото 5 Финал ---
  await show(photo5); await show(final);
}

runShow();
</script>
</body>
  </html>
